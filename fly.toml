app = "avoid-call-backend"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_MODULE = "main:app"
  APP_MODE = "production"
  ENVIRONMENT = "production"
  LOCAL_TEST_MODE = "false"
  LOCAL_OUTBOUND_CALLS = "false"
  OUTBOUND_CALLS_ENABLED = "false"
  AI_FEATURES_ENABLED = "true"
  SERVER_DOMAIN = "avoid-call-backend.fly.dev"
  ALLOWED_HOSTS = ""
  CORS_ALLOWED_ORIGINS = ""
  MAX_REQUEST_BODY_BYTES = "65536"
  VERIFY_TWILIO_SIGNATURES = "true"
  ALLOW_UNAUTHENTICATED_REQUESTS = "false"
  GLOBAL_HTTP_RATE_LIMIT_PER_IP_PER_MINUTE = "120"
  CALLS_PER_USER_PER_MINUTE = "2"
  CALLS_PER_USER_PER_HOUR = "5"
  CALLS_PER_IP_PER_MINUTE = "5"
  CALLS_PER_IP_PER_HOUR = "20"
  PREFETCH_PER_USER_PER_MINUTE = "20"
  PREFETCH_PER_IP_PER_MINUTE = "40"
  PREVIEW_VOICE_PER_USER_PER_MINUTE = "10"
  PREVIEW_VOICE_PER_IP_PER_MINUTE = "20"
  MAX_ACTIVE_CALLS = "1"
  MAX_ACTIVE_CALLS_PER_USER = "1"
  MAX_CALL_DURATION_SECONDS = "300"
  WS_CONNECTS_PER_IP_PER_MINUTE = "20"
  WS_APP_MESSAGES_PER_USER_PER_MINUTE = "30"
  TWILIO_MEDIA_MAX_MESSAGE_BYTES = "32768"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 75

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
